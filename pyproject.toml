[tool.poetry]
name = "repo-prompt"
version = "0.1.0"
description = "An advanced developer productivity tool that connects local code context with LLM-based prompt generation"
authors = ["Aykut Aydin"]
license = "MIT"
readme = "README.md"
packages = [{include = "repo_prompt"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.15.0"
openai = "^1.12.0"
python-dotenv = "^1.0.0"
gitpython = "^3.1.40"
rich = "^13.7.0"
ast-comments = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
repo-prompt = "repo_prompt.cli:app"